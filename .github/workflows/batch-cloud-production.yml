name: Batch Stoic Shorts Cloud Production

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Batch execution target'
        required: true
        type: choice
        options:
          - 'all_batches'
          - 'batch_1 (Days 008-028)'
          - 'batch_2 (Days 030-056)'
          - 'batch_3 (Days 057-084)'
        default: 'all_batches'

permissions:
  contents: write

jobs:
  batch-1:
    if: github.event.inputs.target == 'all_batches' || github.event.inputs.target == 'batch_1 (Days 008-028)'
    name: Batch 1 - Month 1 (Days 008-028)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (FFmpeg & Google Chrome)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg google-chrome-stable

      - name: Install Node Dependencies
        run: npm install

      - name: Run Cloud Batch 1 (Days 8..28)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/cloud-batch-render.py 8 28

  batch-2:
    if: github.event.inputs.target == 'all_batches' || github.event.inputs.target == 'batch_2 (Days 030-056)'
    name: Batch 2 - Month 2 (Days 030-056)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (FFmpeg & Google Chrome)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg google-chrome-stable

      - name: Install Node Dependencies
        run: npm install

      - name: Run Cloud Batch 2 (Days 30..56)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/cloud-batch-render.py 30 56

  batch-3:
    if: github.event.inputs.target == 'all_batches' || github.event.inputs.target == 'batch_3 (Days 057-084)'
    name: Batch 3 - Month 3 (Days 057-084)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (FFmpeg & Google Chrome)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg google-chrome-stable

      - name: Install Node Dependencies
        run: npm install

      - name: Run Cloud Batch 3 (Days 57..84)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/cloud-batch-render.py 57 84
