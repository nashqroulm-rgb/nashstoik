name: Daily Stoic Shorts Pipeline (Zero Deja-Vu Cloud Runner)

on:
  schedule:
    # 04:45 WIB = 21:45 UTC (Jam tayang subuh serentak)
    - cron: '45 21 * * *'
  workflow_dispatch:
    inputs:
      day:
        description: 'Day index to render & publish (1-7 or up to 180)'
        required: false
        default: '1'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (FFmpeg & Google Chrome)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg google-chrome-stable

      - name: Install Node Dependencies
        run: npm install

      - name: Resolve Target Day
        id: resolve_day
        run: |
          DAY="${{ github.event.inputs.day }}"
          if [ -z "$DAY" ]; then
            # Check state/day.json if present, otherwise default to 1
            if [ -f "state/day.json" ]; then
              DAY=$(python3 -c "import json; print(json.load(open('state/day.json')).get('current_day', 1))")
            else
              DAY=1
            fi
          fi
          DAY_STR=$(printf "%03d" "$DAY")
          echo "day=$DAY" >> $GITHUB_OUTPUT
          echo "day_str=$DAY_STR" >> $GITHUB_OUTPUT
          echo "Target production Day: $DAY ($DAY_STR)"

      - name: Fetch or Render Master Video
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DAY_NUM=${{ steps.resolve_day.outputs.day }}
          DAY_STR=${{ steps.resolve_day.outputs.day_str }}
          TAG="v-day-${DAY_STR}"
          VIDEO_FILE="output/nash_stoik_day_${DAY_STR}_compressed.mp4"
          mkdir -p output

          echo "Checking if master video for Day $DAY_STR exists in release $TAG..."
          if gh release download "$TAG" -p "nash_stoik_day_${DAY_STR}_compressed.mp4" -D output --clobber > /dev/null 2>&1; then
            echo "✅ Master video found and downloaded from GitHub Release $TAG!"
          else
            echo "⚡ Release not found. Rendering fresh via cloud pipeline..."
            python3 scripts/fetch-broll.py "$DAY_NUM"
            if [ "$DAY_NUM" -eq 1 ]; then
              HF_SCENE="hyperframes_scenes/scenes/scene_stoic_ethereal.html"
              HF_OUT="public/hyperframes_stoic_ethereal.mp4"
            else
              HF_SCENE="hyperframes_scenes/scenes/scene_day${DAY_STR}.html"
              HF_OUT="public/hyperframes_day${DAY_STR}.mp4"
            fi
            if [ ! -f "$HF_OUT" ]; then
              npx hyperframes render -c "$HF_SCENE" -o "$HF_OUT" --fps 24 --low-memory-mode
            fi
            python3 scripts/render-fast.py "$DAY_NUM"
            gh release create "$TAG" "$VIDEO_FILE" \
              --title "Nash Stoik Day ${DAY_STR}: Master Short Video" \
              --notes "Automated cloud production asset for Nash Stoik Day ${DAY_STR}.\nRendered on GitHub Actions cloud runner." || \
            gh release upload "$TAG" "$VIDEO_FILE" --clobber
          fi

      - name: Publish to Multi-Platform (Autonomous Zernio TikTok & Instagram + YouTube)
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          TIKTOK_ACCOUNT_ID: ${{ secrets.TIKTOK_ACCOUNT_ID }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          python3 scripts/publish.py publish ${{ steps.resolve_day.outputs.day }}

      - name: Update Campaign State
        run: |
          DAY_NUM=${{ steps.resolve_day.outputs.day }}
          NEXT_DAY=$((DAY_NUM + 1))
          mkdir -p state
          echo "{\"current_day\": $NEXT_DAY, \"last_produced_day\": $DAY_NUM, \"updated_at\": \"$(date -u)\"}" > state/day.json
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --quiet && git diff --staged --quiet || git commit -m "chore(state): advance day to $NEXT_DAY and record publish [skip ci]"
          git push origin main || true
